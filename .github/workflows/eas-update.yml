name: EAS Update (OTA)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch (ex.: preview ou production)'
        required: false
        default: 'preview'

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @dailybrief/shared build

      - name: Publish EAS Update
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://noticeme.onrender.com
        run: |
          BRANCH="${{ github.event.inputs.branch || 'preview' }}"
          MESSAGE="${{ github.event.head_commit.message }}"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="Manual OTA update"
          fi
          eas update --branch "$BRANCH" --non-interactive --message "$MESSAGE"
