name: Daily Quote

on:
  schedule:
    # 03:10 UTC = 00:10 BRT (America/Sao_Paulo)
    - cron: '10 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-quote-refresh
  cancel-in-progress: false

jobs:
  refresh-daily-quote:
    name: Refresh Daily Quote
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @dailybrief/shared build

      - name: Run standalone daily quote refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter backend quote:refresh
